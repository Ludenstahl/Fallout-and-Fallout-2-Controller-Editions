name: Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  fallout1-android:
    name: Fallout 1 (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 11
          cache: gradle
      - name: Build
        working-directory: fallout1-ce/os/android
        run: ./gradlew assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout1-ce-controller-debug.apk
          path: fallout1-ce/os/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  fallout2-android:
    name: Fallout 2 (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 11
          cache: gradle
      - name: Build
        working-directory: fallout2-ce/os/android
        run: ./gradlew assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-ce-controller-debug.apk
          path: fallout2-ce/os/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
